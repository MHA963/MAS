world:
  height: 10
  width: 10
  step_time: 0.1
  sample_time: 0.1
  offset: [0, 0]
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - number: 1
    distribution: {name: 'manual'}
    kinematics: {name: 'diff'}
    shape:
      - {name: 'circle', radius: 0.2}
    behavior: {name: 'circle_custom'}
    state: [[10, 5, 0]]
    vel_min: [-3, -3.0]
    vel_max: [3, 3.0]
    color: 'blue'
    arrive_mode: position
    goal_threshold: 0.2
    plot:
      show_trail: true
      show_goal: false
      trail_fill: true


obstacle:
  - number: 1
    shape:
      - {name: 'circle', radius: 0.2}
    color: 'red'
    state: [[5, 5, 0]]
